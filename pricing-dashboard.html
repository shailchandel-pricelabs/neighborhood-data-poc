/* ── Phone-frame harness: real extracted elements use position:fixed against the
   live app's full-screen mobile viewport. We scope those to a centered frame so
   this page still works when previewed on a wide desktop browser. ── */
.phone-frame {
  position: relative;
  max-width: 393px;
  margin: 0 auto;
  height: 100vh;
  /* overflow:hidden still permits *programmatic* scrolling (e.g. a focused
     button's default scroll-into-view) — which is exactly what was shifting
     our absolutely-positioned sheets and bottom nav out of place. overflow:clip
     forbids scrolling outright; the hidden fallback covers older browsers. */
  overflow: hidden;
  overflow: clip;
  background: var(--chakra-colors-productWhite);
  box-shadow: 0 0 40px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
